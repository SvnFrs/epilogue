# Self-hosted stack on the Arch laptop (deployment.md). caddy ⇄ web ⇄ api ⇄ postgres,
# plus a migrate one-shot (eng-review T3) and a pg_dump backup sidecar. Only caddy
# publishes ports (80/443 on EPILOGUE_BIND_IP, default 127.0.0.1); postgres is bound to
# 127.0.0.1. See deployment.md "Known gaps" for what is not wired yet (limits, secrets).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epilogue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epilogue}
      POSTGRES_DB: ${POSTGRES_DB:-epilogue}
    # Publish to localhost only — lets host tools (bun run db:migrate, psql, host-run
    # vitest) reach the DB. The api still connects over the Docker network (postgres:5432)
    # regardless of this mapping.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-epilogue}']
      interval: 5s
      timeout: 5s
      retries: 10

  # one-shot: apply migrations + seed the single owner, then exit 0 (eng-review T3)
  migrate:
    image: ghcr.io/svnfrs/epilogue-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: ['bun', 'src/db/migrate.ts']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-epilogue}:${POSTGRES_PASSWORD:-epilogue}@postgres:5432/${POSTGRES_DB:-epilogue}
      DEFAULT_OWNER_ID: ${OWNER_ID:-00000000-0000-4000-8000-000000000001}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ghcr.io/svnfrs/epilogue-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-epilogue}:${POSTGRES_PASSWORD:-epilogue}@postgres:5432/${POSTGRES_DB:-epilogue}
      OWNER_SECRET: ${OWNER_SECRET:?set OWNER_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - '4000'

  web:
    image: ghcr.io/svnfrs/epilogue-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      OWNER_ID: ${OWNER_ID:-00000000-0000-4000-8000-000000000001}
      OWNER_SECRET: ${OWNER_SECRET:?set OWNER_SECRET}
    depends_on:
      - api
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # the Caddyfile's site address; a *.ts.net name gets its cert from tailscaled
      EPILOGUE_HOST: ${EPILOGUE_HOST:-localhost}
    # One address, not all interfaces. On the server set EPILOGUE_BIND_IP to its tailnet
    # IPv4 (`tailscale ip -4`) so only the tailnet reaches Caddy, never the LAN.
    ports:
      - '${EPILOGUE_BIND_IP:-127.0.0.1}:80:80'
      - '${EPILOGUE_BIND_IP:-127.0.0.1}:443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # tailscaled's socket dir, for *.ts.net certs. The directory rather than the socket
      # file, so a tailscaled restart (new socket) doesn't leave a stale mount.
      - /var/run/tailscale:/var/run/tailscale:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

  # daily pg_dump -Fc into docker/backups/, 7 daily + 4 weekly kept (docker/backup.sh).
  # A failed dump exits non-zero → Docker restarts it; the healthcheck goes unhealthy
  # if no daily dump has landed in ~26h.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-epilogue}
      PGPASSWORD: ${POSTGRES_PASSWORD:-epilogue}
      PGDATABASE: ${POSTGRES_DB:-epilogue}
      BACKUP_KEEP_DAILY: 7
      BACKUP_KEEP_WEEKLY: 4
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'find /backups -name "epilogue-daily-*.dump" -mmin -1560 | grep -q .']
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddydata:
  caddyconfig:
